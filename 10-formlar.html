<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <div>
        <label for="name">Adınız</label>
        <input type="text" id="name" />
      </div>

      <div>
        <label for="surname">Soyadınız</label>
        <input type="text" id="surname" />
      </div>

      <div>
        <label for="parola">Parola</label>
        <input type="password" id="parola" />
      </div>

      <div>
        <label for="intro">Kendini Anlat</label>
        <textarea id="intro" cols="30" rows="5"></textarea>
      </div>
      <div>
        <p>En sevdiğiniz diller</p>
        <input type="radio" id="html" name="programlama" />
        <label for="html">HTML</label>
        <input type="radio" id="css" name="programlama" />
        <label for="css">CSS</label>
        <input type="radio" id="js" name="programlama" />
        <label for="js">JavaScript</label>
      </div>

      <div>
        <p>En sevdiğiniz diller</p>
        <input type="checkbox" id="html" name="programlama" />
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="programlama" />
        <label for="css">CSS</label>
        <input type="checkbox" id="js" name="programlama" />
        <label for="js">JavaScript</label>
      </div>

      <div>
        <label for="cities">Şehir</label>
        <select name="cities" id="cities">
          <option value="istanbul">İstanbul</option>
          <option value="ankara">Ankara</option>
          <option value="izmir">İzmir</option>
        </select>
      </div>
            <div>
        <label for="email">E-posta</label>
        <input type="email" id="email"/>
      </div>

            <div>
        <label for="birthdate">Doğum Tarihi</label>
        <input type="date" id="birthdate" />
      </div>
      <button type="submit">Gönder</button>
      <button type="reset">Temizle</button>
    </form>
  </body>
</html>
